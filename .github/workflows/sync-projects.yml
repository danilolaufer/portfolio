name: Sincronizar proyectos de GitHub

# Lee los repos fijados del perfil y regenera data/projects.json.
# Se ejecuta cada día, al tocar el script o la config, y a mano desde
# la pestaña Actions -> "Sincronizar proyectos de GitHub" -> "Run workflow".
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync-projects.mjs"
      - "portfolio.config.json"
      - ".github/workflows/sync-projects.yml"

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar data/projects.json
        run: node scripts/sync-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain -- data/projects.json)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "Actualiza los proyectos desde GitHub"
          git push
